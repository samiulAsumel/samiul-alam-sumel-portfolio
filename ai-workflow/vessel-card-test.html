<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vessel Card</title>
  </head>
  <body
    style="
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    "
  >
    <div
      style="
        width: 300px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
        overflow: hidden;
        background: #fff;
      "
    >
      <!-- Header -->
      <div style="background: #1e3a5f; padding: 16px 20px">
        <div
          style="
            font-size: 11px;
            color: #90aecb;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
          "
        >
          Mongla Port Authority
        </div>
        <div style="font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.5px">
          MV Sea Horizon
        </div>
        <div style="font-size: 12px; color: #a8c2d8; margin-top: 2px">IMO: 9876543</div>
      </div>

      <!-- Body -->
      <div style="padding: 18px 20px">
        <!-- Status Badge -->
        <div style="margin-bottom: 16px">
          <span
            style="
              display: inline-block;
              background: #f97316;
              color: #fff;
              font-size: 11px;
              font-weight: 700;
              letter-spacing: 1px;
              text-transform: uppercase;
              padding: 4px 12px;
              border-radius: 20px;
            "
            >Arrived</span
          >
        </div>

        <!-- Info Rows -->
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              border-bottom: 1px solid #eef0f3;
              padding-bottom: 8px;
            "
          >
            <span
              style="
                font-size: 12px;
                color: #6b7280;
                text-transform: uppercase;
                letter-spacing: 0.8px;
              "
              >Berth No.</span
            >
            <span style="font-size: 15px; font-weight: 700; color: #1e3a5f">B-07</span>
          </div>

          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              border-bottom: 1px solid #eef0f3;
              padding-bottom: 8px;
            "
          >
            <span
              style="
                font-size: 12px;
                color: #6b7280;
                text-transform: uppercase;
                letter-spacing: 0.8px;
              "
              >Vessel Type</span
            >
            <span style="font-size: 13px; font-weight: 600; color: #374151">Bulk Carrier</span>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center">
            <span
              style="
                font-size: 12px;
                color: #6b7280;
                text-transform: uppercase;
                letter-spacing: 0.8px;
              "
              >ETA</span
            >
            <span style="font-size: 13px; font-weight: 600; color: #374151"
              >15 Jun 2026, 08:30</span
            >
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div
        style="
          background: #f8fafc;
          padding: 10px 20px;
          text-align: right;
          border-top: 1px solid #e5e7eb;
        "
      >
        <span style="font-size: 11px; color: #9ca3af">Last updated: 15 Jun 2026</span>
      </div>
    </div>
  </body>
</html>
